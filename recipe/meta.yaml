{% set name = "pyecospold" %}
{% set version = "4.0.1" %}
{% set python_min = "3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyecospold-{{ version }}.tar.gz
  sha256: c141a19fa40db766368201b56b6000d7758264b170da0f1ce1ae224ed9f7fe5b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - pip
  run:
    - python >={{ python_min }}
    - lxml >=4.9.3  # or remove the pin entirely?
    - numpy >=1.23.3
    - python-dateutil

test:
  imports:
    - pyecospold
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/brightway-lca/pyecospold
  summary: A Python package that converts ecospold XML formats to their Python equivalents and export the same data back to XML.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cmutel
